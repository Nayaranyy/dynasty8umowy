<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty 8 – Generator umów</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0e0e0e;--line:#262626;--tx:#fff;--mut:#a3a3a3;--g:#22c55e;--g2:#4ade80;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
header img{height:52px;width:52px}header h1{font-size:24px}header small{color:var(--g);letter-spacing:.14em;text-transform:uppercase;display:block;font:600 11px Inter}
.wrap{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:24px;padding:22px;max-width:1300px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
form{background:var(--card);border:1px solid var(--line);padding:18px}
fieldset{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:12px 0 0}
legend{color:var(--g);font:600 12px Inter;letter-spacing:.12em;text-transform:uppercase;padding-right:8px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.r .f{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em}
input,select{width:100%;background:#000;border:1px solid var(--line);color:var(--tx);padding:9px 10px;font:inherit}
input:focus,select:focus{outline:0;border-color:var(--g)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button{background:#000;border:1px solid var(--line);color:var(--tx);padding:10px 4px;font:600 12px Inter;cursor:pointer}
.types button.on{background:var(--g);color:#03140a;border-color:var(--g)}
.btn{background:var(--g);color:#03140a;border:0;padding:11px 20px;font:600 13px Inter;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.o{background:none;color:var(--g);border:1px solid var(--g)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hide{display:none}
.note{font-size:12px;color:var(--mut);margin-top:12px}
.wrap>div{min-width:0}.sheetwrap{overflow:hidden}#pages{width:794px;transform-origin:top left}.ov{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:30;padding:16px}.dlg{background:var(--card);border:1px solid var(--line);padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto;position:relative}.dlg .x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}.hr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hr small{color:var(--mut)}.btn.s{padding:6px 12px;font-size:11px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f2a1a;border:1px solid var(--g);padding:10px 18px;z-index:40;display:none;max-width:90%}.act select{width:auto;min-width:150px}.page{user-select:none;-webkit-user-select:none;position:relative;width:794px;height:1123px;background:#fff;color:#111;padding:52px 56px 64px;margin-bottom:20px;font:13.5px/1.55 Inter,Arial,sans-serif;box-shadow:0 0 0 1px #333;overflow:hidden}.pb{height:100%;overflow:hidden}.pn{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;color:#777}
.page h2{text-align:center;font-size:20px;margin-bottom:4px;color:#111}.page .c{text-align:center;margin:0 0 18px}
.page h3{font:700 15px Inter,Arial,sans-serif;text-align:left;margin:18px 0 6px;color:#15803d;border-bottom:1px solid #86efac;padding-bottom:3px}.page table.info{margin:8px 0 6px;font-size:13px}.page table.info th,.page table.info td{text-align:left}.page table.info th{width:36%;background:#f0fdf4}.page p{margin:0 0 8px;text-align:justify}
.page u{text-decoration:none;border-bottom:1px dotted #555;min-width:60px;display:inline-block}
.page table{border-collapse:collapse;width:100%;font-size:12px}.page td,.page th{border:1px solid #999;padding:3px 6px;text-align:right}.page th{background:#eee}
.sig{display:flex;justify-content:space-between;gap:30px;margin-top:48px;text-align:center}.sig div{flex:1}.sig .sg{display:block;font:normal 40px/1.1 'Mrs Saint Delafield','Segoe Script','Brush Script MT',cursive;color:#1b2a6b;border-bottom:1px solid #111;min-height:46px;padding:0 4px}.sig span{display:block;font-size:12px;padding-top:4px}
@page{size:A4;margin:0}@media print{body{background:#fff}header,form,.act,.note{display:none}.wrap{display:block;padding:0}.sheetwrap{height:auto!important;overflow:visible}#pages{transform:none!important;width:auto}.page{box-shadow:none;margin:0;break-after:page}}
</style></head><body>

<script>
var $=function(i){return document.getElementById(i)},T='sale';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function v(i){var x=$(i).value.trim();return x?'<b>'+esc(x)+'</b>':'<u>&nbsp;</u>'}
function n(i){return Number($(i).value)||0}
function m(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fd(d){return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}
function dt(){var x=$('da').value;return x?'<b>'+fd(new Date(x+'T12:00:00'))+'</b>':'<u>&nbsp;</u>'}
function sched(P,N,i,pmt){
  var base=$('da').value?new Date($('da').value+'T12:00:00'):new Date(),rest=P,h='<table><tr><th>Nr</th><th>Termin</th><th>Rata</th><th>Pozostało</th></tr>';
  for(var k=1;k<=N;k++){rest=Math.max(0,rest-(pmt-rest*i));var d=new Date(base.getTime()+k*6048e5);
    h+='<tr><td>'+k+'</td><td>'+fd(d)+'</td><td>'+m(pmt)+'</td><td>'+m(k===N?0:rest)+'</td></tr>'}
  return h+'</table>'}
var Z='<u>&nbsp;</u>';
function tbl(r){return '<table class="info">'+r.map(function(x){return '<tr><th>'+x[0]+'</th><td>'+x[1]+'</td></tr>'}).join('')+'</table>'}
function party(a,b){return v(a)+', SSN: '+v(b)}
function pm(){return '<b>'+esc($('fp').value)+'</b>'}
function H(k,t){return '<h3>§ '+k+'. '+t+'</h3>'}
function mm(x){return x?'<b>'+m(x)+'</b>':Z}
function end(k){return H(k,'Postanowienia końcowe')+'<p>W sprawach nieuregulowanych niniejszą umową zastosowanie mają przepisy obowiązujące w stanie San Andreas oraz inne obowiązujące przepisy prawa. Wszystkie kwoty wyrażone są w dolarach amerykańskich (USD). Umowa została sporządzona w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron.</p>'}
function sig(a,b){return '<div class="sig"><div><i class="sg">'+esc($('an').value.trim())+'</i><span>'+a+'</span></div><div><i class="sg">'+esc($('bn').value.trim())+'</i><span>'+b+'</span></div></div>'}
function build(){
  var h,pc=n('pc'),pd=n('pd')||10,A=party('an','ai'),B=party('bn','bi'),
  intro='<p>Umowa zawarta w dniu '+dt()+' pomiędzy stronami wskazanymi w poniższej tabeli:</p>',
  ow='<p style="margin-left:12px">1. Sprzedający oświadcza, że nieruchomość jest wolna od wad prawnych i roszczeń osób trzecich.</p><p style="margin-left:12px">2. Nabywca oświadcza, że zapoznał się ze stanem nieruchomości i nie wnosi zastrzeżeń.</p><p style="margin-left:12px">3. Strony zobowiązują się do niezwłocznego dostarczenia wszystkich niezbędnych dokumentów do przeniesienia własności.</p>',
  pw='Własność nieruchomości zostanie przeniesiona na Nabywcę po uiszczeniu pełnej ceny sprzedaży oraz dopełnieniu wszelkich formalności wymaganych przez prawo, w tym podpisaniu aktu notarialnego.';
  if(T==='sale'){
    h='<h2>UMOWA SPRZEDAŻY NIERUCHOMOŚCI</h2>'+intro+tbl([['Sprzedający',A],['Nabywca',B],['Adres nieruchomości',v('pa')],['Cena sprzedaży',mm(pc)],['Forma płatności',pm()]])+
    H(1,'Przedmiot umowy')+'<p>Sprzedający oświadcza, że jest właścicielem nieruchomości, o której mowa w powyższej tabeli, i zobowiązuje się sprzedać ją Nabywcy, a Nabywca oświadcza, że zamierza nabyć tę nieruchomość na warunkach określonych w niniejszej umowie.</p>'+
    H(2,'Oświadczenia stron')+ow+
    H(3,'Cena i sposób zapłaty')+'<p>Nabywca zobowiązuje się zapłacić Sprzedającemu cenę sprzedaży w wysokości określonej w powyższej tabeli. Płatność nastąpi w formie wskazanej w tabeli, w terminie ustalonym przez strony.</p>'+
    H(4,'Przeniesienie własności')+'<p>'+pw+'</p>'+end(5)+sig('Sprzedający','Nabywca');
  }else if(T==='rent'){
    h='<h2>UMOWA NAJMU NIERUCHOMOŚCI</h2>'+intro+tbl([['Wynajmujący',A],['Najemca',B],['Adres nieruchomości',v('pa')],['Czynsz miesięczny',mm(n('rt'))],['Kaucja',mm(n('dp'))],['Okres najmu','<b>'+(n('tm')||'…')+' mies.</b>'],['Termin płatności czynszu','do <b>'+pd+'.</b> dnia miesiąca'],['Forma płatności',pm()]])+
    H(1,'Przedmiot i czas najmu')+'<p>Wynajmujący oświadcza, że jest uprawniony do dysponowania nieruchomością, o której mowa w powyższej tabeli, i oddaje ją Najemcy do używania na okres wskazany w tabeli, licząc od dnia zawarcia umowy.</p>'+
    H(2,'Czynsz i sposób zapłaty')+'<p>Najemca zobowiązuje się płacić Wynajmującemu czynsz w wysokości i terminie określonych w powyższej tabeli, w formie w niej wskazanej.</p>'+
    H(3,'Kaucja')+'<p>Najemca wpłaca kaucję w dniu zawarcia umowy. Kaucja zostanie zwrócona w ciągu 14 dni od zwrotu nieruchomości, pomniejszona o ewentualne zaległości i szkody.</p>'+
    H(4,'Obowiązki Najemcy')+'<p>Najemca używa nieruchomości zgodnie z jej przeznaczeniem, nie podnajmuje jej bez zgody Wynajmującego i odpowiada za szkody wykraczające poza normalne zużycie.</p>'+
    H(5,'Wypowiedzenie')+'<p>Każda ze stron może wypowiedzieć umowę z zachowaniem jednomiesięcznego okresu wypowiedzenia. Wynajmujący może wypowiedzieć umowę bez zachowania terminu, gdy Najemca zalega z czynszem za co najmniej dwa miesiące.</p>'+end(6)+sig('Wynajmujący','Najemca');
  }else{
    var dw=Math.min(n('dw'),pc),P=Math.max(0,pc-dw),N=Math.max(1,Math.round(n('ic'))||1),r=n('ir'),i=r/5200,pmt=!P?0:(i?P*i/(1-Math.pow(1+i,-N)):P/N);
    h='<h2>UMOWA SPRZEDAŻY NIERUCHOMOŚCI NA RATY</h2>'+intro+tbl([['Sprzedający',A],['Nabywca',B],['Adres nieruchomości',v('pa')],['Cena sprzedaży',mm(pc)],['Wpłata własna','<b>'+m(dw)+'</b>'],['Kwota do spłaty w ratach','<b>'+m(P)+'</b>'],['Liczba rat','<b>'+N+'</b>'],['Wysokość raty (tygodniowej)','<b>'+m(pmt)+'</b>'],['Termin płatności rat','co <b>7 dni</b>, pierwsza rata: <b>'+fd(new Date((($('da').value?new Date($('da').value+'T12:00:00'):new Date())).getTime()+6048e5))+'</b>'],['Oprocentowanie','<b>'+(r?r+'% rocznie':'bez odsetek')+'</b>'],['Łączna kwota do zapłaty','<b>'+m(dw+pmt*N)+'</b>'],['Forma płatności',pm()]])+
    H(1,'Przedmiot umowy')+'<p>Sprzedający oświadcza, że jest właścicielem nieruchomości, o której mowa w powyższej tabeli, i zobowiązuje się sprzedać ją Nabywcy, a Nabywca oświadcza, że zamierza nabyć tę nieruchomość na warunkach określonych w niniejszej umowie, z płatnością ceny w ratach.</p>'+
    H(2,'Oświadczenia stron')+ow+
    H(3,'Cena i sposób zapłaty')+'<p>Nabywca zobowiązuje się zapłacić Sprzedającemu cenę sprzedaży w wysokości określonej w powyższej tabeli: wpłatę własną w dniu zawarcia umowy, a pozostałą kwotę w ratach tygodniowych, płatnych co 7 dni, w terminie i formie wskazanych w tabeli. Harmonogram spłat stanowi załącznik do umowy.</p>'+
    H(4,'Przeniesienie własności')+'<p>'+pw.replace('uiszczeniu pełnej ceny sprzedaży','uiszczeniu wszystkich rat i pełnej ceny sprzedaży')+' Nabywca otrzymuje nieruchomość do używania w dniu zawarcia umowy, a do czasu przeniesienia własności Sprzedający zastrzega sobie własność nieruchomości.</p>'+
    H(5,'Opóźnienie w płatności')+'<p>Za opóźnienie w zapłacie raty Sprzedający może naliczać odsetki ustawowe za opóźnienie. Opóźnienie w zapłacie co najmniej dwóch kolejnych rat uprawnia Sprzedającego do odstąpienia od umowy po wezwaniu do zapłaty z wyznaczeniem dodatkowego terminu.</p>'+
    end(6)+H(7,'Załącznik – harmonogram spłat')+(P?sched(P,N,i,pmt):'<p>Brak rat do spłaty.</p>')+sig('Sprzedający','Nabywca');
  }
  paginate(h);
}
function setT(t){T=t;document.querySelectorAll('#types button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  document.querySelectorAll('[data-for]').forEach(function(e){e.classList.toggle('hide',e.dataset.for.split(' ').indexOf(t)<0)});
  var rent=t==='rent';$('la').textContent=rent?'Wynajmujący':'Sprzedający';$('lb').textContent=rent?'Najemca':'Nabywca';build()}
$('types').onclick=function(e){if(e.target.dataset.t)setT(e.target.dataset.t)};
$('f').addEventListener('input',build);

function fit(){var s=Math.min(1,$('sw').clientWidth/794);$('pages').style.transform='scale('+s+')';$('sw').style.height=Math.ceil($('pages').offsetHeight*s)+'px'}
function paginate(h){
  var t=document.createElement('div');t.innerHTML=h;var bl=[];
  [].slice.call(t.children).forEach(function(e){
    if(e.tagName==='TABLE'&&!e.classList.contains('info')){var rs=[].slice.call(e.rows),hd=rs.shift();
      for(var q=0;q<rs.length;q+=16){var tb=document.createElement('table');tb.innerHTML=hd.outerHTML+rs.slice(q,q+16).map(function(r){return r.outerHTML}).join('');bl.push([tb])}}
    else bl.push([e])});
  for(var i=0;i<bl.length-1;i++)if(bl[i][0].tagName==='H3'){bl[i]=bl[i].concat(bl[i+1]);bl.splice(i+1,1)}
  var L=bl.length;if(L>1&&bl[L-1][0].classList.contains('sig')){var sg=bl.pop();bl[bl.length-1]=bl[bl.length-1].concat(sg)}
  var P=$('pages'),body;P.innerHTML='';
  function np(){var pg=document.createElement('div');pg.className='page';body=document.createElement('div');body.className='pb';pg.appendChild(body);P.appendChild(pg)}
  function add(b){b.forEach(function(x){body.appendChild(x)})}
  np();
  bl.forEach(function(b){add(b);
    if(body.scrollHeight>body.clientHeight+1&&body.children.length>b.length){b.forEach(function(x){body.removeChild(x)});np();add(b)}});
  var ps=P.querySelectorAll('.page');
  ps.forEach(function(p,i){var f=document.createElement('div');f.className='pn';f.textContent='Dynasty 8 · Strona '+(i+1)+' / '+ps.length;p.appendChild(f)});
  var sel=$('pngsel'),cur=sel.value,o='<option value="all">'+(ps.length>1?'Wszystkie strony (1 obraz)':'Strona 1')+'</option>';
  if(ps.length>1)for(var z=0;z<ps.length;z++)o+='<option value="'+z+'">Strona '+(z+1)+'</option>';
  sel.innerHTML=o;if(cur&&sel.querySelector('option[value="'+cur+'"]'))sel.value=cur;
  fit();
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){build()});

async function flat(fn){var pg=$('pages'),old=pg.style.transform;pg.style.transform='none';
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;return await fn(pg.querySelectorAll('.page'))}finally{pg.style.transform=old;fit()}}
function shot(el){return html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true})}
async function saveFile(name,data){
  var dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
  if(dl)return dl.save({filename:name,data:data});
  var u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
function failX(e){if(!(e&&e.code==='declined'))alert('Nie udało się utworzyć pliku. Spróbuj ponownie.')}
$('pdf').onclick=async function(){
  var b=$('pdf');b.disabled=true;b.textContent='Tworzenie PDF…';
  try{
    var blob=await flat(async function(ps){
      var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      for(var i=0;i<ps.length;i++){var c=await shot(ps[i]);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}
      return pdf.output('blob')});
    await saveFile('umowa-dynasty8.pdf',blob);
  }catch(e){failX(e)}finally{b.disabled=false;b.textContent='Pobierz PDF'}
};
$('png').onclick=async function(){
  var b=$('png'),v=$('pngsel').value;b.disabled=true;b.textContent='Tworzenie PNG…';
  try{
    var blob=await flat(async function(ps){
      var ix=[],cs=[],i;if(v==='all'){for(i=0;i<ps.length;i++)ix.push(i)}else ix=[Number(v)];
      for(i=0;i<ix.length;i++)cs.push(await shot(ps[ix[i]]));
      var gap=cs.length>1?32:0,W=cs[0].width,H=cs.reduce(function(a,c){return a+c.height},0)+gap*(cs.length-1),o=document.createElement('canvas');
      o.width=W;o.height=H;var x=o.getContext('2d');x.fillStyle='#e5e5e5';x.fillRect(0,0,W,H);var y=0;
      cs.forEach(function(c){x.drawImage(c,0,y);y+=c.height+gap});
      return await new Promise(function(r){o.toBlob(r,'image/png')})});
    await saveFile(v==='all'?'umowa-dynasty8.png':'umowa-dynasty8-strona-'+(Number(v)+1)+'.png',blob);
  }catch(e){failX(e)}finally{b.disabled=false;b.textContent='Pobierz PNG'}
};

/* ---------- baza Supabase (zapis umów, tylko po zalogowaniu admina) ---------- */
var CFG=window.D8_CONFIG||{},SB_URL=String(CFG.SUPABASE_URL||'').trim().replace(/\/+$/,''),SB_KEY=String(CFG.SUPABASE_ANON_KEY||'').trim(),REMOTE=!!(SB_URL&&SB_KEY),
  JW='d8:umowy-jwt',TOK=null,CUR=null,FIELDS=['da','an','ai','bn','bi','pa','fp','pc','rt','dp','tm','dw','ic','ir','pd'],NAMES={sale:'Sprzedaż',rent:'Najem',inst:'Sprzedaż na raty'};
try{TOK=sessionStorage.getItem(JW)}catch(e){}
function say(t){var x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(say.t);say.t=setTimeout(function(){x.style.display='none'},4000)}
function fe(e){say('Błąd: '+(e&&e.message||e))}
function api(m,p,b,pf){
  var hd={apikey:SB_KEY,Authorization:'Bearer '+(TOK||SB_KEY),'Content-Type':'application/json'};if(pf)hd.Prefer=pf;
  return fetch(SB_URL+'/rest/v1/'+p,{method:m,headers:hd,body:b?JSON.stringify(b):undefined}).then(function(r){
    if(r.status===401&&TOK)dbOut(true);
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t)});
    return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function dbOut(q){TOK=null;CUR=null;try{sessionStorage.removeItem(JW)}catch(e){}dbui();if(q)say('Sesja wygasła – zaloguj się ponownie.')}
function collect(){var d={};FIELDS.forEach(function(k){d[k]=$(k).value});return d}
function dbui(){
  var b=$('dbx');if(!REMOTE){b.innerHTML='';return}
  b.innerHTML=TOK?'<button class="btn o" id="sv">Zapisz w bazie</button><button class="btn o" id="hs">Historia</button><button class="btn o" id="nw">Nowa</button><button class="btn o" id="lo">Wyloguj</button>':'<button class="btn o" id="li">Zaloguj (zapis w bazie)</button>';
  if(TOK){$('sv').onclick=dbSave;$('hs').onclick=dbHist;$('lo').onclick=function(){dbOut()};
    $('nw').onclick=function(){CUR=null;FIELDS.forEach(function(k){if(k!=='da')$(k).value=''});$('ic').value=24;$('tm').value=12;$('pd').value=10;$('ir').value=0;$('fp').selectedIndex=0;build();say('Nowa umowa.')}}
  else $('li').onclick=dbLogin;
}
function dbSave(){
  var d=collect(),o={type:T,title:(d.an||'—')+' → '+(d.bn||'—'),data:d},b=$('sv');b.disabled=true;
  (CUR?api('PATCH','contracts?id=eq.'+encodeURIComponent(CUR),o,'return=minimal'):api('POST','contracts',o,'return=representation').then(function(r){CUR=r&&r[0]&&r[0].id}))
  .then(function(){say('Zapisano w bazie ✓')}).catch(fe).then(function(){b.disabled=false});
}
function dbLoad(r){CUR=r.id;var d=r.data||{};FIELDS.forEach(function(k){if(d[k]!=null)$(k).value=d[k]});setT(r.type)}
function dbHist(){
  api('GET','contracts?select=id,type,title,created_at&order=created_at.desc&limit=100').then(function(rs){
    var o=document.createElement('div');o.className='ov';
    o.innerHTML='<div class="dlg"><button class="x">×</button><h2>Historia umów</h2>'+(rs.length?rs.map(function(r){return '<div class="hr" data-id="'+esc(String(r.id))+'"><span><b>'+esc(r.title||'')+'</b><br><small>'+esc(NAMES[r.type]||r.type)+' · '+new Date(r.created_at).toLocaleString('pl-PL')+'</small></span><span><button class="btn o s" data-l>Wczytaj</button> <button class="btn o s" data-d>Usuń</button></span></div>'}).join(''):'<p>Brak zapisanych umów.</p>')+'</div>';
    o.onclick=function(e){var t=e.target,row=t.closest&&t.closest('.hr');
      if(t===o||t.className==='x')return o.remove();
      if(!row)return;var id=row.dataset.id;
      if(t.hasAttribute('data-l'))api('GET','contracts?select=*&id=eq.'+encodeURIComponent(id)).then(function(r){if(r&&r[0]){dbLoad(r[0]);o.remove()}}).catch(fe);
      if(t.hasAttribute('data-d')&&confirm('Usunąć tę umowę z bazy?'))api('DELETE','contracts?id=eq.'+encodeURIComponent(id),null,'return=minimal').then(function(){row.remove();if(String(CUR)===id)CUR=null}).catch(fe)};
    document.body.appendChild(o);
  }).catch(fe);
}
function dbLogin(){
  var o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="dlg"><button class="x">×</button><h2>Logowanie</h2><label>E-mail</label><input id="lm" type="email" autocomplete="username"><br><br><label>Hasło</label><input id="lp" type="password" autocomplete="current-password"><div style="margin-top:16px"><button class="btn" id="lg">Zaloguj</button></div></div>';
  document.body.appendChild(o);o.onclick=function(e){if(e.target===o||e.target.className==='x')o.remove()};
  function go(){fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('lm').value.trim(),password:$('lp').value})})
    .then(function(r){return r.json()}).then(function(j){if(!j.access_token)return say('Nieprawidłowy e-mail lub hasło.');TOK=j.access_token;try{sessionStorage.setItem(JW,TOK)}catch(e){}o.remove();dbui();say('Zalogowano.')}).catch(fe)}
  $('lg').onclick=go;$('lp').onkeydown=function(e){if(e.key==='Enter')go()};
}
$('da').value=new Date().toISOString().slice(0,10);setT('sale');dbui();
</script></body></html>
